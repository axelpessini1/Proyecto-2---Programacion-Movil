<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>producto</title>
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/producto.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krub:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Staatliches&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons"
      rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet">
    <script src="../js/producto.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="../index.html">
            <img class="header__logo" src="../img/logo.png" alt="Logotipo">
        </a>
    </header>

    <nav class="navegacion">
        <a class="navegacion__enlace navegacion__enlace--activo" href="../index.html">Tienda</a>
        <a class="navegacion__enlace" href="nosotros.html">Nosotros</a>
    </nav>

    <main class="contenedor">
        <div class="producto-detalle">
            <div class="camisa">
                <img id="producto-imagen" class="camisa__imagen" src="../img/3.jpg" alt="">
            </div>
            <div class="producto-detalle__contenido">
                <span class="producto-detalle__etiqueta">Coleccion Front End</span>
                <h1 id="producto-titulo">ReactJS</h1>
                <p id="producto-precio" class="producto-detalle__precio">$25</p>
                <p id="producto-descripcion">Camiseta comoda y ligera para llevar tu tecnologia favorita todos los dias.</p>
                <label for="talla">Selecciona tu talla</label>
                <select id="talla" name="talla">
                    <option>Selecciona una talla</option>
                    <option>Chica</option>
                    <option>Mediana</option>
                    <option>Grande</option>
                    <option>Extra grande</option>
                </select>
                <button type="button">Agregar al carrito</button>
            </div>
        </div>
        
    </main>

</body>
</html>
